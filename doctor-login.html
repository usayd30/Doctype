<form id="doctorLoginForm">
<label>Email
<input id="loginEmail" type="email" required placeholder="doctor@example.com">

<input id="loginPassword" type="password" required placeholder="Your password">
</label>

<button class="btn full" type="submit">Login</button>
<p id="loginMsg" class="msg"></p>
</form>
