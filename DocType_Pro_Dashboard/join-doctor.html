<main>
<section class="formPage">
<small class="eyebrow">FOR DOCTORS</small>
<h1>Join DocType</h1>
<p>Create your doctor profile and become searchable on DocType.</p>

<form id="joinForm" class="formCard">
<label>Doctor name
<input id="doctorName" required placeholder="Dr. Your Name">
</label>

<label>Specialty
<select id="doctorSpecialty" required>
<option value="">Select specialty</option>
<option>General Physician</option><option>Cardiologist</option>
<option>Dentist</option><option>Dermatologist</option>
<option>Orthopedic</option><option>Pediatrician</option>
<option>Ophthalmologist</option><option>Gynecologist</option>
</select>
</label>

<label>City
<select id="doctorCity" required>
<option value="">Select city</option>
<option>Kanpur</option><option>Lucknow</option><option>Delhi</option>
<option>Jaipur</option><option>Mumbai</option>
</select>
</label>

<label>Experience
<input id="doctorExperience" required placeholder="e.g. 8 years">
</label>

<label>Consultation fee (₹)
<input id="doctorFee" type="number" min="0" required placeholder="e.g. 500">
</label>

<label>Phone number
<input id="doctorPhone" type="tel" pattern="[0-9]{10}" maxlength="10" required placeholder="10-digit mobile number">
</label>

<label>Email
<input id="doctorEmail" type="email" required placeholder="doctor@example.com">
</label>

<label>Create password
<input id="doctorPassword" type="password" minlength="6" required placeholder="Minimum 6 characters">
</label>

<button class="btn full" type="submit">Create Doctor Profile</button>
<p id="joinMsg" class="msg"></p>
</form>
</section>
</main>

</body>
</html>
